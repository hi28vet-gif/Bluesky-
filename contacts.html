<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <title>BLUESKY — Контакты</title>
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand font-weight-bold" href="index.html">
          <span class="badge badge-primary mr-1">B</span> BLUESKY
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">ГЛАВНАЯ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catalog.html">КАТАЛОГ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">О НАС</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link" href="contacts.html">КОНТАКТЫ</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mb-4">
          <h1 class="font-weight-bold mb-3">Контакты</h1>
          <p class="text-muted">Есть вопрос по наличию товара, доставке или возврату? Напишите нам.</p>
          <p class="mb-1"><strong>Телефон:</strong> +7 (800) 555-35-35</p>
          <p class="mb-1"><strong>Email:</strong> support@bluesky-store.example</p>
          <p class="mb-4"><strong>Адрес:</strong> ул. Технологическая, д. 12</p>
          <a href="index.html" class="btn btn-outline-light btn-sm">&larr; На главную</a>
        </div>

        <div class="col-md-6">
          <form action="contacts.html" method="get" class="p-4 border rounded">
            <div class="form-group">
              <label for="user-name">Ваше имя</label>
              <input type="text" class="form-control" id="user-name" name="name" placeholder="Введите имя" required>
            </div>
            <div class="form-group">
              <label for="user-email">Электронная почта</label>
              <input type="email" class="form-control" id="user-email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
              <label for="user-message">Сообщение</label>
              <textarea class="form-control" id="user-message" name="message" rows="4" placeholder="Ваш вопрос..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить сообщение</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light py-4 mt-4 border-top">
    <div class="container text-center">
      <span class="text-muted">&copy; 2026 BLUESKY. Все права защищены.</span>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
</body>
</html>
